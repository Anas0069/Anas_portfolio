<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 400vh;
    background: #0a0a0c;
    font-family: 'JetBrains Mono', 'Courier New', monospace;

  }
  #canvas-wrap {

  #launch-touchdesigner {

  #launch-touchdesigner:hover,

  .graph-name {

  #label-start { top: 50vh; transform: translate(-50%, -50%); opacity: 1; }

  #progress-track {

  #cluster-panel {

  #cluster-panel.open {

  #cluster-panel-title {

</style>

<script src="https://unpkg.com/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>
<script type="module">
import * as THREE from 'three';

// ---------- MediaPipe hand tracking: Phase 1 ----------
const handStatus = document.getElementById('hand-status');
const enableHandBtn = document.getElementById('enable-hand');
const handDistanceEl = document.getElementById('hand-distance');
const handVideo = document.getElementById('hand-video');
const handPanel = document.getElementById('hand-panel');
const cameraControl = document.getElementById('launch-touchdesigner');

let handLandmarker = null;
let handStream = null;
let handTrackingStarted = false;
let lastVideoTime = -1;
let handRotationY = 0;
let handRotationX = 0;

const HAND_MODEL_URL =
  "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

async function setupHandTracking() {
  if (handTrackingStarted || cameraControl.disabled) return;
  cameraControl.disabled = true;
  enableHandBtn.style.opacity = '0.55';
  enableHandBtn.textContent = 'Loading MediaPipe...';
  handStatus.textContent = 'HAND TRACKING: LOADING';

  try {
    const vision = await window.vision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
    );

    handLandmarker = await window.vision.HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: HAND_MODEL_URL
      },
      runningMode: "VIDEO",
      numHands: 1
    });

    handStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    handVideo.srcObject = handStream;
    await handVideo.play();

    handTrackingStarted = true;
    handVideo.classList.add('visible');
    handPanel.classList.add('visible');
    handStatus.textContent = 'HAND TRACKING: ACTIVE';
    handStatus.classList.add('active');
    enableHandBtn.textContent = 'Camera active';
    cameraControl.disabled = false;
    cameraControl.classList.add('active');
    cameraControl.setAttribute('aria-pressed', 'true');
    cameraControl.title = 'Camera hand controls active';

    requestAnimationFrame(trackHand);
  } catch (error) {
    console.error('MediaPipe setup failed:', error);
    handStatus.textContent = 'HAND TRACKING: ERROR';
    cameraControl.disabled = false;
    cameraControl.title = 'Camera unavailable — check browser permission';
    enableHandBtn.style.opacity = '1';
    enableHandBtn.textContent = 'Camera unavailable';
    handDistanceEl.textContent = 'Check camera permission / localhost';
  }
}

function landmarkDistance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const dz = a.z - b.z;
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function trackHand() {
  if (!handTrackingStarted || !handLandmarker) return;

  if (handVideo.readyState >= 2 && handVideo.currentTime !== lastVideoTime) {
    lastVideoTime = handVideo.currentTime;

    const result = handLandmarker.detectForVideo(
      handVideo,
      performance.now()
    );

    if (result.landmarks && result.landmarks.length > 0) {
      const landmarks = result.landmarks[0];

      // MediaPipe landmark 4 = thumb tip
      // MediaPipe landmark 16 = ring finger tip
      const thumbTip = landmarks[4];
      const ringTip = landmarks[16];

      const rawDistance = landmarkDistance(thumbTip, ringTip);
      const indexTip = landmarks[8];

      // Drive the browser's 3D visualization directly with live MediaPipe data.
      handRotationY = (0.5 - indexTip.x) * 1.7;
      handRotationX = (0.5 - indexTip.y) * 0.85;

      handDistanceEl.textContent =
        `Thumb ↔ Ring: ${rawDistance.toFixed(3)}`;
    } else {
      handRotationY *= 0.92;
      handRotationX *= 0.92;
      handDistanceEl.textContent = 'Thumb ↔ Ring: —';
    }
  }

  requestAnimationFrame(trackHand);
}

// Camera access is opt-in: the visitor starts it from the camera control.
cameraControl.addEventListener('click', setupHandTracking);


// ---------- scene setup ----------
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

const rig = new THREE.Group(); // everything rotates via this group
rig.scale.setScalar(0.85);
scene.add(rig);

// ---------- accent colors ----------
const ACCENT = 0x4ee0c8;
const GRID = 0x2a2f33;
const POINT_DIM = 0x6b7478;

// ---------- data generation ----------
// Deterministic pseudo-random for consistent look
function rand(seed) {
  const x = Math.sin(seed * 999) * 10000;
  return x - Math.floor(x);
}

const PALETTE = [
  { name: 'Who I Am (Introduction)', hex: 0x7c3aed }, // Violet
  { name: 'The Grind (Education)', hex: 0x4f46e5 }, // Indigo
  { name: "What I've Built (Projects)", hex: 0x3b82f6 }, // Blue
  { name: 'Brainy Stuff (Research Papers)', hex: 0x22c55e }, // Green
  { name: 'Been There, Done That (Experience)', hex: 0xeab308 }, // Yellow
  { name: 'My Toolkit (Technical Skills)', hex: 0xf97316 }, // Orange
  { name: "Let's Link (Connect)", hex: 0xef4444 }, // Red
  { name: 'Flex Zone (Extras/Achievements)', hex: 0xec4899 }, // Pink
];

const PER_CLUSTER = 550;
const N = PALETTE.length * PER_CLUSTER;

// Fibonacci sphere distribution: spaces the 8 cluster centers as far apart
// from each other as possible in 3D (no two clusters share a hemisphere
// direction), so every color — including pink and red — lands in its own
// clearly separated region once the scene rotates, rather than bunching
// along the regression line.
function fibonacciSphere(i, n, radius) {
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  const yNorm = 1 - (i / (n - 1)) * 2; // 1 -> -1
  const radiusAtY = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
  const theta = goldenAngle * i;
  return {
    x: Math.cos(theta) * radiusAtY * radius,
    y: yNorm * radius * 0.6, // compress vertical spread a touch
    z: Math.sin(theta) * radiusAtY * radius,
  };
}

const CLUSTER_RADIUS = 4.6;
const clusterCenters = PALETTE.map((c, i) => fibonacciSphere(i, PALETTE.length, CLUSTER_RADIUS));

// tighter, denser jitter around each center — reads as a dense point
// cloud (lots of data) rather than a handful of scattered dots
function denseJitter(seed, spread) {
  const a = rand(seed * 2.13) - 0.5;
  const b = rand(seed * 5.77) - 0.5;
  return (a + b) * spread; // triangular-ish distribution, denser toward center
}

const points2D = []; // {x,y}
const points3D = []; // {x,y,z}
const pointColors = []; // THREE.Color per point
const pointCluster = []; // cluster index per point, used for hover/labels later

for (let ci = 0; ci < PALETTE.length; ci++) {
  const center = clusterCenters[ci];
  for (let j = 0; j < PER_CLUSTER; j++) {
    const seed = ci * 977 + j;
    const jx = denseJitter(seed * 3.1, 0.9);
    const jy = denseJitter(seed * 7.7, 0.8);
    const jz = denseJitter(seed * 13.3, 0.9);
    const x = center.x + jx;
    const y = center.y + jy;
    const z = center.z + jz;
    points2D.push({ x, y, z: 0 });
    points3D.push({ x, y, z });
    pointColors.push(new THREE.Color(PALETTE[ci].hex));
    pointCluster.push(ci);
  }
}

// ---------- point cloud (dotted look via sprite circles) ----------
function makeDotTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.9)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const dotTex = makeDotTexture();

const clusterGroups = [];
const clusterPositionAttributes = [];
const clusterMaterials = [];
const clusterHitTargets = [];
const hitMaterial = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
const hitGeometry = new THREE.SphereGeometry(1.35, 16, 12);

// Each colored cloud has its own group and invisible bounding sphere. This
// makes the whole cluster a single clickable object rather than 550 tiny hits.
for (let ci = 0; ci < PALETTE.length; ci++) {
  const center = clusterCenters[ci];
  const positions = new Float32Array(PER_CLUSTER * 3);
  const colors = new Float32Array(PER_CLUSTER * 3);

  for (let j = 0; j < PER_CLUSTER; j++) {
    const i = ci * PER_CLUSTER + j;
    positions[j * 3] = points2D[i].x - center.x;
    positions[j * 3 + 1] = points2D[i].y - center.y;
    positions[j * 3 + 2] = 0;
    colors[j * 3] = pointColors[i].r;
    colors[j * 3 + 1] = pointColors[i].g;
    colors[j * 3 + 2] = pointColors[i].b;
  }

  const geometry = new THREE.BufferGeometry();
  const positionAttribute = new THREE.BufferAttribute(positions, 3);
  geometry.setAttribute('position', positionAttribute);
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const material = new THREE.PointsMaterial({
    size: 0.13,
    map: dotTex,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const group = new THREE.Group();
  group.position.set(center.x, center.y, 0);
  group.add(new THREE.Points(geometry, material));

  const hitTarget = new THREE.Mesh(hitGeometry, hitMaterial);
  hitTarget.userData.clusterIndex = ci;
  group.add(hitTarget);
  rig.add(group);

  clusterGroups.push(group);
  clusterPositionAttributes.push(positionAttribute);
  clusterMaterials.push(material);
  clusterHitTargets.push(hitTarget);
}

// ---------- regression line (dotted) ----------
function regressionLinePoints(t) {
  const p1 = new THREE.Vector3(-6.4, 0.55 * -6.4, 0);
  const p2 = new THREE.Vector3(6.4, 0.55 * 6.4, 0);
  return [p1, p2];
}
const [lp1, lp2] = regressionLinePoints(0);
const lineGeo = new THREE.BufferGeometry().setFromPoints(
  Array.from({length: 40}, (_, i) => {
    const t = i / 39;
    return new THREE.Vector3(
      THREE.MathUtils.lerp(lp1.x, lp2.x, t),
      THREE.MathUtils.lerp(lp1.y, lp2.y, t),
      0
    );
  })
);
const lineMat = new THREE.LineDashedMaterial({
  color: ACCENT,
  dashSize: 0.12,
  gapSize: 0.12,
  transparent: true,
  opacity: 0.85
});
const regLine = new THREE.Line(lineGeo, lineMat);
regLine.computeLineDistances();

// ---------- axes ----------
function makeAxis(dir, length, color) {
  const points = [new THREE.Vector3(0,0,0), dir.clone().multiplyScalar(length)];
  const g = new THREE.BufferGeometry().setFromPoints(points);
  const m = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.5 });
  return new THREE.Line(g, m);
}
const axisX = makeAxis(new THREE.Vector3(1,0,0), 7, GRID);
const axisXneg = makeAxis(new THREE.Vector3(-1,0,0), 7, GRID);
const axisY = makeAxis(new THREE.Vector3(0,1,0), 4.5, GRID);
const axisYneg = makeAxis(new THREE.Vector3(0,-1,0), 4.5, GRID);
rig.add(axisX, axisXneg, axisY, axisYneg);

// z axis fades in as we rotate
const axisZ = makeAxis(new THREE.Vector3(0,0,1), 7, ACCENT);
const axisZneg = makeAxis(new THREE.Vector3(0,0,-1), 7, ACCENT);
axisZ.material.opacity = 0;
axisZneg.material.opacity = 0;
rig.add(axisZ, axisZneg);

// faint ground grid (xz plane) that fades in with rotation, sells the 3D depth
const gridHelper = new THREE.GridHelper(14, 16, GRID, GRID);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0;
gridHelper.position.y = -3.6;
rig.add(gridHelper);

// ---------- scroll-driven progress ----------
let progress = 0; // 0 -> 1
const scrollHeight = () => document.body.scrollHeight - window.innerHeight;

function updateFromScroll() {
  const p = window.scrollY / scrollHeight();
  progress = THREE.MathUtils.clamp(p, 0, 1);
}

// ---------- free drag-to-orbit (mouse) ----------
let dragRotY = 0, dragRotX = 0;
let isDragging = false, lastPointerX = 0, lastPointerY = 0;
let pointerStartX = 0, pointerStartY = 0, pointerMoved = false;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let selectedClusterIndex = null;
let panelOpen = false;
let selectionProgress = 0;
let selectionFrom = 0;
let selectionTarget = 0;
let selectionStartedAt = 0;
const activeClusterPosition = new THREE.Vector3(-4.6, 0, 1.1);
const clusterPanel = document.getElementById('cluster-panel');
const clusterPanelTitle = document.getElementById('cluster-panel-title');
const closeClusterPanel = document.getElementById('close-cluster-panel');

function animateSelection(target) {
  selectionFrom = selectionProgress;
  selectionTarget = target;
  selectionStartedAt = performance.now();
}

function closeSelectedCluster() {
  if (selectedClusterIndex === null) return;
  panelOpen = false;
  clusterPanel.classList.remove('open');
  clusterPanel.setAttribute('aria-hidden', 'true');
  animateSelection(0);
}

function selectCluster(clusterIndex) {
  if (selectedClusterIndex === clusterIndex && panelOpen) {
    closeSelectedCluster();
    return;
  }
  selectedClusterIndex = clusterIndex;
  selectionProgress = 0;
  panelOpen = true;
  clusterPanelTitle.textContent = PALETTE[clusterIndex].name;
  clusterPanel.classList.add('open');
  clusterPanel.setAttribute('aria-hidden', 'false');
  animateSelection(1);
}

function hitTestCluster(clientX, clientY) {
  const bounds = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - bounds.left) / bounds.width) * 2 - 1;
  pointer.y = -((clientY - bounds.top) / bounds.height) * 2 + 1;
  rig.updateMatrixWorld(true);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clusterHitTargets, false)[0];
  if (hit) selectCluster(hit.object.userData.clusterIndex);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  pointerMoved = false;
});
window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  if (Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY) > 6) pointerMoved = true;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  if (!pointerMoved) return;
  wrap.classList.add('dragging');
  dragRotY += dx * 0.006;
  dragRotX = THREE.MathUtils.clamp(dragRotX + dy * 0.006, -1.3, 1.3);
  resetBtn.classList.toggle('visible', Math.abs(dragRotY) > 0.02 || Math.abs(dragRotX) > 0.02);
});
window.addEventListener('pointerup', (e) => {
  if (isDragging && !pointerMoved) hitTestCluster(e.clientX, e.clientY);
  isDragging = false;
  wrap.classList.remove('dragging');
});

const resetBtn = document.getElementById('reset-view');
resetBtn.addEventListener('click', () => {
  dragRotY = 0;
  dragRotX = 0;
  resetBtn.classList.remove('visible');
});
closeClusterPanel.addEventListener('click', closeSelectedCluster);

// ---------- easing ----------
function easeInOutCubic(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3) / 2;
}

// ---------- animation loop ----------
const labelStart = document.getElementById('label-start');
const labelMid = document.getElementById('label-mid');
const labelEnd = document.getElementById('label-end');
const greeting = document.getElementById('greeting');
const progressFill = document.getElementById('progress-fill');
const scrollHint = document.getElementById('scroll-hint');
const legend = document.getElementById('legend');
const axisXTitle = document.getElementById('axis-x-title');
const axisYTitle = document.getElementById('axis-y-title');

const GREETINGS = [
  { text: "Hi, I'm Muhammed Anas", lang: 'en', dir: 'ltr' },
  { text: 'مرحبًا، أنا محمد أنس', lang: 'ar', dir: 'rtl' },
  { text: 'नमस्ते, मैं मुहम्मद अनस हूँ', lang: 'hi', dir: 'ltr' },
  { text: 'ನಮಸ್ಕಾರ, ನಾನು ಮುಹಮ್ಮದ್ ಅನಸ್', lang: 'kn', dir: 'ltr' },
  { text: 'ഹായ്, ഞാൻ മുഹമ്മദ് അനസ്', lang: 'ml', dir: 'ltr' },
];
let greetingIndex = 0;

setInterval(() => {
  greeting.classList.add('is-changing');
  setTimeout(() => {
    greetingIndex = (greetingIndex + 1) % GREETINGS.length;
    const nextGreeting = GREETINGS[greetingIndex];
    greeting.textContent = nextGreeting.text;
    greeting.lang = nextGreeting.lang;
    greeting.dir = nextGreeting.dir;
    greeting.classList.remove('is-changing');
  }, 220);
}, 1900);

PALETTE.forEach(c => {
  const row = document.createElement('div');
  row.className = 'legend-row';
  const dot = document.createElement('span');
  dot.className = 'legend-dot';
  dot.style.background = '#' + c.hex.toString(16).padStart(6, '0');
  const label = document.createElement('span');
  label.textContent = c.name;
  row.appendChild(dot);
  row.appendChild(label);
  legend.appendChild(row);
});

function render() {
  // Stage 1: multilingual introduction. Stage 2: a stable 2D chart.
  // Stage 3: continued scrolling unlocks the 3D data transformation.
  const introMove = THREE.MathUtils.smoothstep(progress, 0.03, 0.27);
  const visualProgress = THREE.MathUtils.clamp((progress - 0.65) / 0.35, 0, 1);
  const e = easeInOutCubic(visualProgress);
  const graphVisibility = THREE.MathUtils.smoothstep(progress, 0.34, 0.46);
  wrap.style.opacity = graphVisibility;
  wrap.style.pointerEvents = graphVisibility > 0.98 ? 'auto' : 'none';
  labelStart.style.top = `${THREE.MathUtils.lerp(50, 12, introMove)}vh`;
  labelStart.style.transform = `translate(-50%, ${THREE.MathUtils.lerp(-50, 0, introMove)}%)`;

  // rotate rig right -> left (negative Y rotation) up to ~55 degrees, revealing depth
  // plus whatever free-drag offset the user has applied on top
  const maxRotation = -0.95; // radians (~ -54deg)
  rig.rotation.y = maxRotation * e + dragRotY + handRotationY;
  rig.rotation.x = 0.12 * e + dragRotX + handRotationX; // slight tilt down for perspective, drag, and hand control

  if (selectionStartedAt) {
    const elapsed = Math.min((performance.now() - selectionStartedAt) / 520, 1);
    selectionProgress = THREE.MathUtils.lerp(selectionFrom, selectionTarget, easeInOutCubic(elapsed));
    if (elapsed === 1) {
      selectionStartedAt = 0;
      if (selectionTarget === 0) selectedClusterIndex = null;
    }
  }

  // Make room for the larger panel while keeping the complete graph visible.
  rig.position.x = THREE.MathUtils.lerp(0, -1.2, selectionProgress);

  // Morph each independently clickable point cloud from its 2D location to 3D.
  for (let ci = 0; ci < PALETTE.length; ci++) {
    const center = clusterCenters[ci];
    const group = clusterGroups[ci];
    const posAttr = clusterPositionAttributes[ci];
    const isSelected = ci === selectedClusterIndex;

    for (let j = 0; j < PER_CLUSTER; j++) {
      const i = ci * PER_CLUSTER + j;
      posAttr.setZ(j, (points3D[i].z - center.z) * e);
    }
    posAttr.needsUpdate = true;

    const originalPosition = new THREE.Vector3(center.x, center.y, center.z * e);
    group.position.lerpVectors(originalPosition, activeClusterPosition, isSelected ? selectionProgress : 0);
    const scale = isSelected ? THREE.MathUtils.lerp(1, 0.46, selectionProgress) : 1;
    group.scale.setScalar(scale);
    clusterMaterials[ci].opacity = isSelected
      ? 0.92
      : THREE.MathUtils.lerp(0.85, 0.3, selectionProgress);
  }

  // fade in z-axis + grid as rotation progresses
  const zOpacity = THREE.MathUtils.smoothstep(visualProgress, 0.15, 0.7);
  axisZ.material.opacity = zOpacity * 0.7;
  axisZneg.material.opacity = zOpacity * 0.7;
  gridHelper.material.opacity = zOpacity * 0.25;

  // dim the regression line as it becomes less "the whole story"
  lineMat.opacity = THREE.MathUtils.lerp(0.85, 0.35, e);

  // camera subtle dolly for drama
  camera.position.z = THREE.MathUtils.lerp(12, 14, e);
  camera.position.y = THREE.MathUtils.lerp(0, 0.8, e);
  camera.lookAt(0, 0, 0);

  // labels crossfade
  labelStart.style.opacity = 1 - THREE.MathUtils.smoothstep(progress, 0.43, 0.56);
  labelMid.style.opacity =
    THREE.MathUtils.smoothstep(progress, 0.48, 0.58) *
    (1 - THREE.MathUtils.smoothstep(progress, 0.68, 0.78));
  labelEnd.style.opacity = THREE.MathUtils.smoothstep(progress, 0.82, 0.96);

  progressFill.style.height = (progress * 100) + '%';
  scrollHint.textContent = progress < 0.34 ? 'scroll to enter' : progress < 0.65 ? 'scroll to transform' : 'scroll to explore';
  scrollHint.style.opacity = progress > 0.94 ? 0 : 0.6;
  legend.classList.toggle('visible', visualProgress > 0.3);
  axisXTitle.classList.toggle('visible', graphVisibility > 0.9 && visualProgress < 0.5);
  axisYTitle.classList.toggle('visible', graphVisibility > 0.9 && visualProgress < 0.5);

  renderer.render(scene, camera);
  requestAnimationFrame(render);
}

window.addEventListener('scroll', updateFromScroll, { passive: true });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateFromScroll();
render();
</script>
</body>
</html>
