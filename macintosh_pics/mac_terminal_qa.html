<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mac Terminal — Ask Me Anything</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  }

  .window {
    width: 100%;
    height: 100%;
    background: transparent;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: none;
    display: flex;
    flex-direction: column;
  }

  .titlebar {
    height: 34px;
    background: linear-gradient(#3a3a3c, #2c2c2e);
    display: flex;
    align-items: center;
    padding: 0 14px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(0,0,0,0.4);
  }

  .dots { display: flex; gap: 8px; }
  .dot {
    width: 12px;
    height: 12px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: rgba(16,16,20,0.82);
    font: 800 10px/1 Arial, sans-serif;
  }
  .dot:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .dot.red { background: #ff5f57; }
  .dot.yellow { background: #febc2e; }
  .dot.green { background: #28c840; }

  .titlebar .label {
    flex: 1;
    text-align: center;
    color: #a9a9ab;
    font-size: 13px;
    margin-right: 60px;
  }

  .screen {
    flex: 1;
    background: #0d0d12;
    padding: 14px 16px;
    overflow-y: auto;
    font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.55;
    color: #d6d6d6;
  }

  .screen::-webkit-scrollbar { width: 8px; }
  .screen::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  .line { white-space: pre-wrap; word-wrap: break-word; margin-bottom: 2px; }
  .prompt-label { color: #5ff271; }
  .path { color: #6db3ff; }
  .user-text { color: #f2f2f2; }
  .answer { color: #b9c4ff; }
  .system-msg { color: #7d7d85; font-style: italic; }
  .error-msg { color: #ff6b6b; }

  .input-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }

  .input-row .prompt-label { flex-shrink: 0; }
  .input-row .path { flex-shrink: 0; }

  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #f2f2f2;
    font-family: inherit;
    font-size: 14px;
    caret-color: #5ff271;
  }

  .cursor-blink {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: #5ff271;
    animation: blink 1s steps(2) infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .typing-dots span {
    animation: pulse 1.2s infinite;
    display: inline-block;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* The parent uses a compact iframe for minimized sessions. Keep the whole
     titlebar visible and deliberately scale the terminal UI for that view. */
  @media (max-width: 300px), (max-height: 200px) {
    .titlebar { height: 25px; padding: 0 8px; }
    .dots { gap: 5px; }
    .dot { width: 11px; height: 11px; font-size: 8px; }
    .titlebar .label {
      font-size: 9px;
      margin-right: 32px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .screen { padding: 7px 9px; font-size: 9px; line-height: 1.35; }
    .input-row { gap: 4px; margin-top: 2px; }
    #cmd-input { font-size: 9px; }
    .cursor-blink { width: 5px; height: 10px; }
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dots">
      <button class="dot red" type="button" aria-label="Close terminal" title="End session">×</button>
      <button class="dot yellow" type="button" aria-label="Minimize terminal" title="Minimize">□</button>
      <button class="dot green" type="button" aria-label="Restore terminal" title="Restore">●</button>
    </div>
    <div class="label">guest — ask-me — 80×24</div>
  </div>
  <div class="screen" id="screen">
    <div class="line system-msg">Last login: today on ttys000</div>
    <div class="line system-msg">Type a question and press Enter. Type 'help' for tips, 'clear' to reset.</div>
    <div class="line">&nbsp;</div>
  </div>
</div>

<script>
const screen = document.getElementById('screen');
let history = []; // {role, content}
let busy = false;

function sendWindowAction(action) {
  window.parent.postMessage({ type: 'anas-terminal-window-action', action }, '*');
}

document.querySelector('.dot.red').addEventListener('click', () => sendWindowAction('close'));
document.querySelector('.dot.yellow').addEventListener('click', () => sendWindowAction('minimize'));
document.querySelector('.dot.green').addEventListener('click', () => sendWindowAction('restore'));

function makeInputRow() {
  const row = document.createElement('div');
  row.className = 'input-row';
  row.innerHTML = `<span class="prompt-label">guest@mac</span><span class="path">~ %</span> <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" />`;
  screen.appendChild(row);
  const input = row.querySelector('#cmd-input');
  input.focus();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !busy) {
      const val = input.value.trim();
      handleSubmit(val, row, input);
    }
  });
  screen.scrollTop = screen.scrollHeight;
  return input;
}

function appendLine(html, cls) {
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.innerHTML = html;
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
  return div;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function handleSubmit(val, row, input) {
  input.disabled = true;
  row.remove();
  appendLine(`<span class="prompt-label">guest@mac</span><span class="path">~ %</span> <span class="user-text">${escapeHtml(val)}</span>`);

  if (val === '') { makeInputRow(); return; }

  if (val.toLowerCase() === 'clear') {
    screen.innerHTML = '';
    history = [];
    makeInputRow();
    return;
  }

  if (val.toLowerCase() === 'help') {
    appendLine(`Ask anything — e.g. "what's the capital of Japan" or "explain closures in JS".`, 'system-msg');
    appendLine(`Commands: clear (reset screen), help (this message)`, 'system-msg');
    appendLine('&nbsp;');
    makeInputRow();
    return;
  }

  busy = true;
  const thinking = appendLine(`<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>`, 'system-msg');

  try {
    const answer = await askClaude(val);
    thinking.remove();
    appendLine(escapeHtml(answer), 'answer');
  } catch (err) {
    thinking.remove();
    appendLine(`zsh: error reaching model — ${escapeHtml(err.message || String(err))}`, 'error-msg');
  }

  appendLine('&nbsp;');
  busy = false;
  makeInputRow();
}

async function askClaude(question) {
  history.push({ role: 'user', content: question });

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: 'You are a terse, helpful assistant embedded in a retro Mac terminal. Answer clearly and concisely, plain text only (no markdown formatting, no asterisks, no headers) since output renders in a monospace terminal.',
      messages: history
    })
  });

  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }

  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  const answer = textBlock ? textBlock.text : '(no response)';
  history.push({ role: 'assistant', content: answer });
  return answer;
}

makeInputRow();
</script>

</body>
</html>
